<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity_2</title>

    <style>

        .profile-card { width: 320px; margin: 0 auto; background: #fff; border: 1px solid #cbd5e1; 
            border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); overflow: hidden; } 
        .avatar-img { width: 100px; height: 100px; border: 4px solid #fff; border-radius: 50%; object-fit: 
        cover; } 
        .action-btn { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: none; borderradius: 6px; cursor: pointer; transition: all .2s ease; } 
        .action-btn:hover { background: #2563eb; transform: translateY(-2px); } 
        .action-btn:active { transform: translateY(0); } 
    </style>
</head>
<body>
   <div class="profile-card"> 
        <div class="avatar-container"><img src="avatar.jpg" alt="Profile avatar" class="avatar
        img"></div> 
        <div class="profile-content"> 
        <h2 class="user-name">Dr. Sarah Khan</h2> 
        <p class="user-role">Associate Professor and Researcher</p> 
        <button class="action-btn">View Profile</button> 
        </div> 
    </div>  

</body>
</html>
