<!DOCTYPE html>
<html>
<head>
    <title>Article Preview</title>

    <style>
            body {
        font-family: Arial;
        background-color: lightgray;
    }

    .article {
        background-color: white;
        width: 500px;
        padding: 20px;
        margin: 50px auto;
        border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

    .category {
        color: blue;
        font-size: 14px;
        font-weight: bold;
    }

    h1 {
        font-size: 28px;
        font-weight: bold;
    }

    .author {
        font-size: 14px;
        color: gray;
    }

    .description {
        font-size: 16px;
        line-height: 1.5;
    }

    .read-more {
        color: blue;
        font-weight: bold;
        text-decoration: none;
    }

    .read-more:hover {
        color: red;
        text-decoration: underline;
    }

    .read-more:active {
        color: green;
    }
    </style>
</head>

<body>

    <div class="article">

        <p class="category">Technology</p>

        <h1>What is Artificial Intelligence?</h1>

        <p class="author">By Muhammad Sohail - October 5, 2026</p>

        <p class="description">
            Artificial Intelligence is a technology that allows
            computers to perform tasks that normally need human thinking.
        </p>

        <a href="#" class="read-more">Read More</a>

    </div>

</body>
</html>
