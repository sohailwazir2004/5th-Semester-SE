<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form</title>
</head>
<body>
    
    <form action="submit" style="border: 1px outset black;">
        <h2>basic form</h2>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter email" style="width: 500px; font-size: 16px;"><br><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter password" style="width: 500px; font-size: 16px;"><br><br>
        <input type="checkbox" ><span>Remember me</span><br><br>
        <input type="button" name="submit" id="submit" value="Submit">


    </form>
</body>
</html>
